name = "wraperers-platform"
main = "src/index.js"
compatibility_date = "2026-08-15"

# The portal lives on exactly one address. Never use a wildcard here:
# wraperers.com, www and admin belong to the live wraperers-v2 Worker.
workers_dev = false
preview_urls = false

[[routes]]
pattern = "app.wraperers.com"
custom_domain = true

[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.client.js"]
fallthrough = true

[observability]
enabled = true

# Public settings only. Secrets go in `wrangler secret put` (see .dev.vars.example).
[vars]
APP_ORIGIN = "https://app.wraperers.com"

[[d1_databases]]
binding = "DB"
database_name = "wraperers-platform-db"
database_id = "c906b221-eaee-461d-a5cb-db5a42dd852d"
migrations_dir = "migrations"

# Local development only: without this, `wrangler dev` pretends requests arrive on
# app.wraperers.com (from the route above) and the Origin check rejects localhost.
[dev]
host = "localhost:8787"
upstream_protocol = "http"
port = 8787
